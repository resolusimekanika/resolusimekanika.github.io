name: arena-proyeksi-diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arena-proyeksi-diagnostic.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Are.na v3 channel contents
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          url='https://api.are.na/v3/channels/4179389/contents?'+urllib.parse.urlencode({
            'page':1,'per':100
          })
          req=urllib.request.Request(url, headers={
            'User-Agent':'ResolusiMekanikaPortfolio/1.0 (+https://resolusimekanika.github.io; mechanicalresolution@gmail.com)',
            'Accept':'application/json'
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              data=json.load(r)
          print('META', json.dumps(data.get('meta'), ensure_ascii=False))
          rows=[]
          for item in data.get('data') or []:
              t=item.get('type')
              if t not in ('Image','ImageBlock'):
                  continue
              image=item.get('image') or {}
              connection=item.get('connection') or {}
              rows.append({
                'id':item.get('id'),
                'position':connection.get('position'),
                'title':item.get('title'),
                'description':(item.get('description') or {}).get('plain') if isinstance(item.get('description'),dict) else item.get('description'),
                'alt_text':item.get('alt_text'),
                'filename':image.get('filename'),
                'content_type':image.get('content_type'),
                'width':image.get('width'),
                'height':image.get('height'),
                'original_url':image.get('original_url'),
                'large_url':image.get('large_url'),
                'display_url':image.get('display_url'),
                'thumb_url':image.get('thumb_url')
              })
          print('IMAGE_COUNT', len(rows))
          for row in rows:
              print('BLOCK', json.dumps(row, ensure_ascii=False))
          PY
