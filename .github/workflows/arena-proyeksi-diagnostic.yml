name: arena-proyeksi-diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arena-proyeksi-diagnostic.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract image URLs from public Are.na page
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request, html as htmlmod
          url='https://www.are.na/d-wibowo/proyeksi-gerilya'
          req=urllib.request.Request(url, headers={
            'User-Agent':'ResolusiMekanikaPortfolio/1.0 (+https://resolusimekanika.github.io; mechanicalresolution@gmail.com)',
            'Accept':'text/html'
          })
          html=urllib.request.urlopen(req, timeout=30).read().decode('utf-8','replace')
          patterns=[
            r'https://d2w9rnfcy7mm78\.cloudfront\.net/(\d+)/original_[^"\\&<]+',
            r'https://images\.are\.na/[^"\\<]+'
          ]
          found=[]
          seen=set()
          for pat in patterns:
              for m in re.finditer(pat, html):
                  u=htmlmod.unescape(m.group(0)).replace('\\u0026','&')
                  if u in seen: continue
                  seen.add(u)
                  block=m.group(1) if m.lastindex else None
                  start=max(0,m.start()-350)
                  end=min(len(html),m.end()+350)
                  context=re.sub(r'\s+',' ',html[start:end])
                  found.append((block,u,context))
          print("FOUND",len(found))
          for block,u,context in found:
              print("IMAGE", block or "-", u)
              print("CONTEXT", context[:900])
          PY
