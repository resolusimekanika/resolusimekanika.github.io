name: proyeksi-face-detect-temp

on:
  push:
    branches: [tmp-proyeksi-face-detect-20261106]
    paths:
      - ".github/workflows/proyeksi-face-detect-temp.yml"

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - name: Install Pillow
        run: pip install -q pillow
      - name: Export remaining rough-cut face candidates
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, io, base64
          from PIL import Image

          url='https://d2w9rnfcy7mm78.cloudfront.net/39533690/original_fcbdd8ff36c0e597a9ed333de392456d.jpg'
          req=urllib.request.Request(url,headers={'User-Agent':'ResolusiMekanikaPortfolio/1.0'})
          im=Image.open(io.BytesIO(urllib.request.urlopen(req,timeout=30).read())).convert('RGB')
          w,h=im.size
          cands=[
            (0.54271,0.48704,'rough_C'),
            (0.83490,0.54537,'rough_D'),
            (0.48906,0.42222,'rough_E'),
            (0.34714,0.30509,'rough_B2')
          ]
          for nx,ny,label in cands:
              cx,cy=nx*w,ny*h
              half=108
              crop=im.crop((max(0,int(cx-half)),max(0,int(cy-half)),min(w,int(cx+half)),min(h,int(cy+half))))
              crop.thumbnail((180,180))
              b=io.BytesIO()
              crop.save(b,'JPEG',quality=82,optimize=True)
              print('CROP',label,base64.b64encode(b.getvalue()).decode('ascii'))
          PY
