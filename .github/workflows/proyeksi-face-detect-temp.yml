name: proyeksi-face-detect-temp

on:
  push:
    branches: [tmp-proyeksi-face-detect-20261106]
    paths:
      - ".github/workflows/proyeksi-face-detect-temp.yml"

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Install OpenCV
        run: pip install -q opencv-python-headless==4.10.0.84 numpy
      - name: Match screenshot crops to source frames
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, urllib.request, cv2, numpy as np, json

          UA='ResolusiMekanikaPortfolio/1.0 (+https://resolusimekanika.github.io; mechanicalresolution@gmail.com)'
          shots = {
            1: "",
            2: "",
            3: ""
          }

          sources = {
            39533690: 'fcbdd8ff36c0e597a9ed333de392456d.jpg',
            39533637: 'a7bdc084c5bc314b1445044c4e1db684.jpg'
          }

          templates={}
          for idx,b64 in shots.items():
              arr=np.frombuffer(base64.b64decode(b64),np.uint8)
              templates[idx]=cv2.imdecode(arr,cv2.IMREAD_COLOR)

          masks={}
          for idx,t in templates.items():
              h,w=t.shape[:2]
              mask=np.full((h,w),255,np.uint8)
              if idx==1:
                  cv2.circle(mask,(96,90),17,0,-1)
              elif idx==2:
                  cv2.circle(mask,(26,27),17,0,-1)
              masks[idx]=mask

          for bid,fn in sources.items():
              url=f'https://d2w9rnfcy7mm78.cloudfront.net/{bid}/original_{fn}'
              raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':UA}),timeout=30).read()
              src=cv2.imdecode(np.frombuffer(raw,np.uint8),cv2.IMREAD_COLOR)
              H,W=src.shape[:2]
              for idx,tpl in templates.items():
                  th,tw=tpl.shape[:2]
                  best=None
                  for scale in np.linspace(0.32,0.62,121):
                      rw=max(1,int(round(W*scale))); rh=max(1,int(round(H*scale)))
                      if rw<tw or rh<th: continue
                      rs=cv2.resize(src,(rw,rh),interpolation=cv2.INTER_AREA)
                      try:
                          res=cv2.matchTemplate(rs,tpl,cv2.TM_CCORR_NORMED,mask=masks[idx])
                      except Exception:
                          res=cv2.matchTemplate(rs,tpl,cv2.TM_CCOEFF_NORMED)
                      _,score,_,loc=cv2.minMaxLoc(res)
                      if best is None or score>best['score']:
                          x,y=loc
                          best={'score':float(score),'scale':float(scale),'x':int(x),'y':int(y),'rw':rw,'rh':rh}
                  if best:
                      best['source_id']=bid
                      best['shot']=idx
                      best['crop_center_x_norm']=(best['x']+tw/2)/best['rw']
                      best['crop_center_y_norm']=(best['y']+th/2)/best['rh']
                      print('MATCH',json.dumps(best))
          PY
