name: proyeksi-face-detect-temp

on:
  push:
    branches: [tmp-proyeksi-face-detect-20261106]
    paths:
      - ".github/workflows/proyeksi-face-detect-temp.yml"

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Install OpenCV
        run: pip install -q opencv-python-headless==4.10.0.84 numpy
      - name: Detect clear faces
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, cv2, numpy as np, json

          UA='ResolusiMekanikaPortfolio/1.0 (+https://resolusimekanika.github.io; mechanicalresolution@gmail.com)'
          items=[
            (39533691,'f47a4f1452e4bffee979c8a021c7c844.jpg'),
            (39533690,'fcbdd8ff36c0e597a9ed333de392456d.jpg'),
            (39533689,'f3a887789c99c494856dee8695a51a90.jpg'),
            (39533688,'fc495fbb29cb0d5172dec1a5aa47a360.jpg'),
            (39533668,'fa0d69d1718ba012a95b53dede3ecb08.jpg'),
            (39533669,'75dbab0ad5a1cfc8e9ddeeca070ab30c.jpg'),
            (39533666,'c30b162a8d3510741d305ad41f5435fb.jpg'),
            (39533665,'5a70ad3d5ffb2ec21fb818124a2fd94d.jpg'),
            (39533644,'a3325b76d5b811b9e536195e35fa5f16.jpg'),
            (39533646,'bc52f5339d09f53e0bd7d1fc6e6d5482.jpg'),
            (39533645,'402f763febc9ee43119abd0d8da85b7a.jpg'),
            (39533639,'deac764c6aae9a016d3bd4df89cc4799.jpg'),
            (39533637,'a7bdc084c5bc314b1445044c4e1db684.jpg')
          ]

          frontal=cv2.CascadeClassifier(cv2.data.haarcascades+'haarcascade_frontalface_default.xml')
          profile=cv2.CascadeClassifier(cv2.data.haarcascades+'haarcascade_profileface.xml')

          def iou(a,b):
              ax,ay,aw,ah=a; bx,by,bw,bh=b
              x1=max(ax,bx); y1=max(ay,by)
              x2=min(ax+aw,bx+bw); y2=min(ay+ah,by+bh)
              inter=max(0,x2-x1)*max(0,y2-y1)
              union=aw*ah+bw*bh-inter
              return inter/union if union else 0

          for bid,fn in items:
              url=f'https://d2w9rnfcy7mm78.cloudfront.net/{bid}/original_{fn}'
              raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':UA}),timeout=30).read()
              img=cv2.imdecode(np.frombuffer(raw,np.uint8),cv2.IMREAD_COLOR)
              h,w=img.shape[:2]
              gray=cv2.cvtColor(img,cv2.COLOR_BGR2GRAY)
              gray=cv2.equalizeHist(gray)

              boxes=[]
              for cascade in (frontal, profile):
                  found=cascade.detectMultiScale(gray, scaleFactor=1.08, minNeighbors=5, minSize=(18,18), flags=cv2.CASCADE_SCALE_IMAGE)
                  boxes.extend([tuple(map(int,b)) for b in found])

              # opposite profile on horizontal flip
              flip=cv2.flip(gray,1)
              found=profile.detectMultiScale(flip, scaleFactor=1.08, minNeighbors=5, minSize=(18,18), flags=cv2.CASCADE_SCALE_IMAGE)
              for x,y,bw,bh in found:
                  boxes.append((w-int(x)-int(bw),int(y),int(bw),int(bh)))

              # dedupe, prefer larger boxes first
              kept=[]
              for b in sorted(boxes,key=lambda z:z[2]*z[3],reverse=True):
                  if all(iou(b,k)<0.30 for k in kept):
                      kept.append(b)

              circles=[]
              for x,y,bw,bh in kept:
                  # ignore tiny/ambiguous detections relative to original frame
                  if bw < max(20, w*0.012) or bh < max(20, h*0.018):
                      continue
                  cx=(x+bw/2)/w
                  cy=(y+bh/2)/h
                  # black dot enlarged beyond detected face
                  r=max(bw,bh)*0.66/max(w,h)
                  circles.append([round(cx,5),round(cy,5),round(r,5)])
              print('FACE',json.dumps({'id':bid,'width':w,'height':h,'circles':circles}))
          PY
