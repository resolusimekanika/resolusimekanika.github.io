name: proyeksi-face-detect-temp

on:
  push:
    branches: [tmp-proyeksi-face-detect-20261106]
    paths:
      - ".github/workflows/proyeksi-face-detect-temp.yml"

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Detect face candidates only
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, cv2, numpy as np, json
          UA='ResolusiMekanikaPortfolio/1.0 (+https://resolusimekanika.github.io; mechanicalresolution@gmail.com)'
          base='https://raw.githubusercontent.com/opencv/opencv/master/samples/dnn/face_detector/'
          urllib.request.urlretrieve(base+'deploy.prototxt','/tmp/deploy.prototxt')
          urllib.request.urlretrieve('https://raw.githubusercontent.com/opencv/opencv_3rdparty/dnn_samples_face_detector_20170830/res10_300x300_ssd_iter_140000.caffemodel','/tmp/face.caffemodel')
          net=cv2.dnn.readNetFromCaffe('/tmp/deploy.prototxt','/tmp/face.caffemodel')
          items=[
            (39533690,'fcbdd8ff36c0e597a9ed333de392456d.jpg'),
            (39533637,'a7bdc084c5bc314b1445044c4e1db684.jpg')
          ]
          for bid,fn in items:
              url=f'https://d2w9rnfcy7mm78.cloudfront.net/{bid}/original_{fn}'
              raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':UA}),timeout=30).read()
              img=cv2.imdecode(np.frombuffer(raw,np.uint8),cv2.IMREAD_COLOR)
              h,w=img.shape[:2]
              out=[]
              for mirrored in (False,True):
                  src=cv2.flip(img,1) if mirrored else img
                  blob=cv2.dnn.blobFromImage(cv2.resize(src,(300,300)),1.0,(300,300),(104,177,123))
                  net.setInput(blob)
                  det=net.forward()
                  for i in range(det.shape[2]):
                      conf=float(det[0,0,i,2])
                      if conf < 0.28: continue
                      x1,y1,x2,y2=(det[0,0,i,3:7]*np.array([w,h,w,h])).astype(int)
                      if mirrored:
                          ox1=w-x2; ox2=w-x1; x1,x2=ox1,ox2
                      x1=max(0,x1); y1=max(0,y1); x2=min(w,x2); y2=min(h,y2)
                      bw=x2-x1; bh=y2-y1
                      if bw<18 or bh<18: continue
                      out.append({
                        'conf':round(conf,3),
                        'cx':round((x1+x2)/2/w,5),
                        'cy':round((y1+y2)/2/h,5),
                        'w':round(bw/w,5),
                        'h':round(bh/h,5),
                        'mirror':mirrored
                      })
              print('FACESET',json.dumps({'id':bid,'faces':out}))
          PY
