name: arena-proyeksi-diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arena-proyeksi-diagnostic.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install object detector
        run: pip install -q ultralytics pillow
      - name: Inspect projection/walk candidates
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, io
          import numpy as np
          from PIL import Image
          from ultralytics import YOLO

          candidates={65,64,63,62,61,60,59,58,57,43,42,39,37,36,26,25,24,23,22,20,19,18,17,16,15,14,11,10,9,8}
          API='https://api.are.na/v3/channels/4179389/contents?page=1&per=100'
          UA='ResolusiMekanikaPortfolio/1.0 (+https://resolusimekanika.github.io; mechanicalresolution@gmail.com)'
          data=json.load(urllib.request.urlopen(urllib.request.Request(API,headers={'User-Agent':UA,'Accept':'application/json'}),timeout=30))
          model=YOLO('yolo11n.pt')
          for item in data.get('data') or []:
              pos=(item.get('connection') or {}).get('position')
              if pos not in candidates: continue
              image=item.get('image') or {}
              bid=item.get('id'); fn=image.get('filename') or ''; title=item.get('title') or ''
              url=f'https://d2w9rnfcy7mm78.cloudfront.net/{bid}/original_{fn}'
              raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':UA}),timeout=30).read()
              im=Image.open(io.BytesIO(raw)).convert('RGB'); im.thumbnail((640,640))
              result=model.predict(source=np.asarray(im),conf=0.20,verbose=False)[0]
              labels=[]
              for box in result.boxes:
                  cls=int(box.cls[0]); conf=float(box.conf[0])
                  labels.append((model.names[cls],round(conf,2)))
              labels=sorted(labels,key=lambda x:-x[1])[:12]
              print('OBJ',json.dumps({'position':pos,'id':bid,'title':title,'objects':labels},ensure_ascii=False))
          PY
