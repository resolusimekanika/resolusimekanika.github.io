name: arena-proyeksi-diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arena-proyeksi-diagnostic.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract embedded Are.na page data
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.request
          url='https://www.are.na/d-wibowo/proyeksi-gerilya'
          req=urllib.request.Request(url, headers={
            'User-Agent':'ResolusiMekanikaPortfolio/1.0 (+https://resolusimekanika.github.io; mechanicalresolution@gmail.com)',
            'Accept':'text/html'
          })
          html=urllib.request.urlopen(req, timeout=30).read().decode('utf-8','replace')
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>', html, re.S)
          print("HTML_LEN", len(html), "NEXT", bool(m))
          if not m:
              raise SystemExit(1)
          data=json.loads(m.group(1))
          seen=set()
          rows=[]
          def walk(x):
              if isinstance(x, dict):
                  img=x.get('image')
                  if isinstance(img, dict) and x.get('id') is not None:
                      bid=x.get('id')
                      if bid not in seen:
                          seen.add(bid)
                          orig=img.get('original') or {}
                          rows.append({
                            'id':bid,
                            'position':x.get('position'),
                            'class':x.get('class'),
                            'title':x.get('title'),
                            'generated_title':x.get('generated_title'),
                            'description':x.get('description'),
                            'content':x.get('content'),
                            'filename':orig.get('filename') or img.get('filename'),
                            'url':orig.get('url'),
                            'display':(img.get('display') or {}).get('url'),
                            'large':(img.get('large') or {}).get('url'),
                            'thumb':(img.get('thumb') or {}).get('url'),
                            'width':orig.get('width') or img.get('width'),
                            'height':orig.get('height') or img.get('height')
                          })
                  for v in x.values(): walk(v)
              elif isinstance(x, list):
                  for v in x: walk(v)
          walk(data)
          print("IMAGE_BLOCKS", len(rows))
          for row in rows:
              print("BLOCK", json.dumps(row, ensure_ascii=False))
          PY
