name: arena-proyeksi-diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arena-proyeksi-diagnostic.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Are.na Proyeksi Gerilya endpoints
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/156.0.0.0 Safari/537.36'
          probe () {
            label="$1"
            url="$2"
            echo "=== $label ==="
            code=$(curl -L -sS -A "$UA" -H 'Accept: application/json,text/html;q=0.9,*/*;q=0.8' -o /tmp/probe.out -w '%{http_code}' "$url")
            echo "STATUS $code"
            head -c 3000 /tmp/probe.out || true
            echo
          }
          probe PAGE 'https://www.are.na/d-wibowo/proyeksi-gerilya'
          probe V2 'https://api.are.na/v2/channels/proyeksi-gerilya?per=100'
          probe V3 'https://api.are.na/v3/channels/proyeksi-gerilya?per=100'
          probe SEARCH 'https://api.are.na/v2/search/channels?q=proyeksi%20gerilya&per=20'
