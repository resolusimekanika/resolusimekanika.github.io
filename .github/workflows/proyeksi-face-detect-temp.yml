name: proyeksi-face-detect-temp

on:
  push:
    branches: [tmp-proyeksi-face-detect-20261106]
    paths:
      - ".github/workflows/proyeksi-face-detect-temp.yml"

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Install detectors
        run: pip install -q ultralytics opencv-python-headless==4.10.0.84 numpy
      - name: Inspect only the two requested censor frames
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, cv2, numpy as np, json
          from ultralytics import YOLO
          UA='ResolusiMekanikaPortfolio/1.0 (+https://resolusimekanika.github.io; mechanicalresolution@gmail.com)'
          items=[
            (39533690,'fcbdd8ff36c0e597a9ed333de392456d.jpg'),
            (39533637,'a7bdc084c5bc314b1445044c4e1db684.jpg')
          ]
          model=YOLO('yolo11n.pt')
          frontal=cv2.CascadeClassifier(cv2.data.haarcascades+'haarcascade_frontalface_default.xml')
          profile=cv2.CascadeClassifier(cv2.data.haarcascades+'haarcascade_profileface.xml')
          for bid,fn in items:
              url=f'https://d2w9rnfcy7mm78.cloudfront.net/{bid}/original_{fn}'
              raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':UA}),timeout=30).read()
              img=cv2.imdecode(np.frombuffer(raw,np.uint8),cv2.IMREAD_COLOR)
              h,w=img.shape[:2]
              result=model.predict(source=img,classes=[0],conf=0.20,verbose=False)[0]
              people=[]
              for box in result.boxes:
                  x1,y1,x2,y2=box.xyxy[0].tolist()
                  people.append({
                    'conf':round(float(box.conf[0]),3),
                    'cx':round(((x1+x2)/2)/w,5),
                    'cy':round(((y1+y2)/2)/h,5),
                    'w':round((x2-x1)/w,5),
                    'h':round((y2-y1)/h,5),
                    'head_guess_y':round((y1+(y2-y1)*0.12)/h,5)
                  })
              gray=cv2.equalizeHist(cv2.cvtColor(img,cv2.COLOR_BGR2GRAY))
              faces=[]
              for kind,cascade in [('front',frontal),('profile',profile)]:
                  for x,y,bw,bh in cascade.detectMultiScale(gray,1.08,5,minSize=(18,18)):
                      faces.append({
                        'kind':kind,
                        'cx':round((x+bw/2)/w,5),
                        'cy':round((y+bh/2)/h,5),
                        'w':round(bw/w,5),
                        'h':round(bh/h,5)
                      })
              print('FRAME',json.dumps({'id':bid,'people':people,'faces':faces}))
          PY
